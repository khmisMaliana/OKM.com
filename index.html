<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>OKM</title>

<style>
:root{--w:520px;--b1:#000;--b2:#06070a;--b3:#10131a;--tx:#edeff3;--mu:rgba(201,206,214,.67);--cd:rgba(255,255,255,.08);--sk:rgba(201,206,214,.22);--a1:#ffb866;--a2:#c9ced6;--bt:#1a1100;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

#app{max-width:var(--w);margin:auto;padding:70px 12px 24px;position:relative;min-height:100vh}
.card{background:var(--cd);border:1px solid var(--sk);border-radius:20px;padding:12px}
.btn{background:linear-gradient(90deg,var(--a2),var(--a1));color:var(--bt);border:0;border-radius:16px;padding:14px;font-size:17px;font-weight:700;width:100%}
.mini{border:2px solid var(--sk);background:var(--cd);color:var(--tx);border-radius:50%;width:30px;height:30px;font-weight:700;font-size:11px;margin:0 3px}
.mini.on{background:var(--a1);color:var(--bt)}
input,textarea{width:100%;background:var(--cd);border:1px solid var(--sk);border-radius:14px;color:var(--tx);padding:12px;font-size:16px;margin-top:8px}
#top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;max-width:var(--w);margin:auto}
.rb{width:40px;height:40px;border-radius:50%;background:var(--cd);border:1px solid var(--sk);color:var(--a1);font-size:18px}
#pal{position:fixed;top:calc(60px + env(safe-area-inset-top));inset-inline-start:max(12px,calc((100vw - var(--w))/2 + 12px));background:var(--b2);border:1px solid var(--sk);border-radius:24px;padding:10px;z-index:6;display:none;max-width:250px;max-height:75vh;overflow:auto}
.dot{display:inline-block;width:28px;height:28px;border-radius:50%;margin:3px;border:2px solid var(--sk)}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:center}
.orb{padding:6px;font-size:10px;font-weight:700}
.orb i{display:flex;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2c3038,#000);border:2px solid #c9ced6;align-items:center;justify-content:center;font-size:24px;font-style:normal}
.f{cursor:pointer;margin-top:8px;display:flex;align-items:center;gap:10px}
.f.lock{opacity:.55}
.s1 .f{border-radius:14px}.s2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.s2 .f{flex-direction:column;text-align:center;height:132px;justify-content:center;margin:0}

.pill{background:none;border:0;color:var(--a1);font-weight:700;padding:10px 14px;font-size:14px}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden;min-height:100dvh}
#app{min-height:100dvh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.dlg>div{max-height:85dvh;-webkit-overflow-scrolling:touch}
select{font-size:16px}button,.row,.f,.orb{touch-action:manipulation}
#fab{bottom:calc(24px + env(safe-area-inset-bottom)) !important}
@media(hover:hover){.f,.row{transition:border-color .15s}.f:hover,.row:hover{border-color:var(--a1)}}

.rb,.mini{display:inline-flex;align-items:center;justify-content:center;padding:0}.mini.ic{width:40px;height:40px;border-radius:14px}

#lv{position:fixed;inset:0;z-index:99;background:#000;display:none}

#lv .lb:active,#lv .lb:hover{opacity:1}

:root{--g1:var(--a1);--g2:var(--a2);--g3:color-mix(in srgb,var(--a1) 55%,var(--a2));--ac:var(--a1)}
.cs{display:block;flex:none;overflow:visible;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--c1) 55%,transparent))}.cs .tw{animation:tw 6s ease-in-out infinite;animation-delay:var(--dl,0s)}@keyframes tw{50%{opacity:.4}}.cs .pl{animation:pl 6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes pl{50%{transform:scale(1.12) rotate(8deg)}}
.sk2{display:grid;place-items:center;flex:none;border-radius:30%;background:radial-gradient(120% 100% at 30% 0%,color-mix(in srgb,var(--g2) 20%,var(--b2)),var(--b2));border:1px solid color-mix(in srgb,var(--g1) 22%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 22px rgba(0,0,0,.3)}

<script>
// ===== Firebase (مشروع ngeu-fed66): يحلّ محلّ الخادم القديم، والواجهة كما هي =====
const FBC={apiKey:"AIzaSyABYShzBLN94AMY3HahMMlckzPDUVllUsI",authDomain:"ngeu-fed66.firebaseapp.com",projectId:"ngeu-fed66",appId:"1:479373777299:web:91e2fda2b127c8b0ccb066"};
const FBL=(async()=>{const V="https://www.gstatic.com/firebasejs/10.14.0/",[a,f,u]=await Promise.all([import(V+"firebase-app.js"),import(V+"firebase-firestore.js"),import(V+"firebase-auth.js")]);const ap=a.initializeApp(FBC);return{db:f.getFirestore(ap),f,u,au:u.getAuth(ap)}})();
const fTd=()=>new Date().toISOString().slice(0,10),fUc=c=>String(c||"").trim().toUpperCase().replace(/[^A-Z0-9-]/g,""),fEm=c=>c.toLowerCase()+"@ngeu.app";
async function fAuth(c){const{u,au}=await FBL;if(au.currentUser&&au.currentUser.email==fEm(c))return;const pw=c.padEnd(6,"_");try{await u.signInWithEmailAndPassword(au,fEm(c),pw)}catch(e){await u.createUserWithEmailAndPassword(au,fEm(c),pw)}}
async function fMe(c,first){const{db,f}=await FBL,r=f.doc(db,"students",c),x=await f.getDoc(r);if(!x.exists())return{rc:403,js:{e:"code"}};const d=x.data();if(d.off)return{rc:403,js:{e:"off"}};
 const adm=d.role=="super",ex=!adm&&d.end&&d.end<fTd();
 if(first){if(ex)return{rc:403,js:{e:"expired"}};const dl=d.devices||[],dv=NET.dev();if(!dl.includes(dv)){if(dl.length>=(d.maxDev||2))return{rc:403,js:{e:"devices"}};await f.updateDoc(r,{devices:f.arrayUnion(dv),lastSeen:fTd()})}else if(d.lastSeen!==fTd())await f.updateDoc(r,{lastSeen:fTd()})}
 try{await fAuth(c)}catch(e){return{rc:403,js:{e:"code"}}}
 let un="",uu="",ut=0;try{const q=await f.getDoc(f.doc(db,"cfg","upd"));if(q.exists()){const w=q.data();un=w.n||"";uu=w.u||"";ut=w.ut||0}}catch(e){}
 const exp=adm||!d.end?-1:Math.max(0,Math.ceil((new Date(d.end+"T23:59:59Z")-Date.now())/864e5));
 return{rc:200,js:{role:adm?"a":d.role=="mod"?"p":"",fac:d.fac??-1,spec:d.spec??0,exp,un,uu,ut}}}
const UCF={r:0,w:0},SMP=Math.random()<.1,ucf=(r,w)=>{if(SMP){UCF.r+=r;UCF.w+=w}};
async function fFlush(){if(!UCF.r&&!UCF.w)return;const{r,w}=UCF;UCF.r=UCF.w=0;try{const{db,f}=await FBL;await f.setDoc(f.doc(db,"usage",fTd()),{r:f.increment(r*10),w:f.increment(w*10+10)},{merge:true})}catch(e){UCF.r+=r;UCF.w+=w}}
setInterval(fFlush,6e5);document.addEventListener("visibilitychange",()=>{if(document.hidden)fFlush()});setTimeout(fFlush,20000);

async function fRoute(m,p,body,code){try{
 const{db,f}=await FBL,c=fUc(code),[pa,qs]=p.split("?"),v=+((qs||"").split("=")[1]||-1),bump=()=>f.setDoc(f.doc(db,"cfg","specs"),{v:Date.now()});
 if(c=="TRIAL"){const END=Date.UTC(2027,0,2);if(Date.now()>=END)return{rc:403,js:{e:"expired"}};
  if(pa=="/login"||pa=="/me"){await fGuest();return{rc:200,js:{role:"",fac:+(LS.gf??-1),spec:+(LS.gs||0),exp:Math.ceil((END-Date.now())/864e5),un:"",uu:"",ut:0}}}
  if(pa=="/pick"){if(+LS.gs>0)return{rc:403,js:null};LS.gf=body.fac;LS.gs=body.spec;return{rc:200,js:{}}}
  if(m!="GET"&&pa!="/specs"||pa=="/upd"||pa=="/notify"||pa.startsWith("/specs/")||(pa=="/specs"&&m!="GET"))return{rc:403,js:null};
  if(pa.startsWith("/a/"))await fGuest()}
 if(pa=="/login"){ucf(3,1);const r=await fMe(c,true);if(r.rc==200){LS.meC=c;LS.meJ=JSON.stringify(r.js);LS.meT=Date.now()}return r}
 if(pa=="/me"){if(LS.meC==c&&LS.meJ&&Date.now()-(+LS.meT||0)<3e5)return{rc:200,js:JSON.parse(LS.meJ)};ucf(2,0);const r=await fMe(c,false);if(r.rc==200){LS.meC=c;LS.meJ=JSON.stringify(r.js);LS.meT=Date.now()}return r}
 if(pa=="/specs"&&m=="GET"){if(v>=0&&Date.now()-(+LS.spT||0)<3e5)return{rc:200,js:{same:true}};LS.spT=Date.now();const g=await f.getDoc(f.doc(db,"cfg","specs")),cv=g.exists()?g.data().v:0;ucf(1,0);if(cv===v)return{rc:200,js:{same:true}};const l=await f.getDocs(f.collection(db,"specs"));ucf(l.size,0);return{rc:200,js:{s:l.docs.map(d=>d.data()),v:cv}}}
 if(pa=="/specs"&&m=="POST"){const i=Math.floor(Date.now()/1000);await f.setDoc(f.doc(db,"specs",""+i),{i,f:body.f,y:body.y,n:body.n});await bump();LS.spT=0;ucf(0,2);return{rc:200,js:{i}}}
 if(pa.startsWith("/specs/")&&m=="DELETE"){await f.deleteDoc(f.doc(db,"specs",pa.slice(7)));await bump();LS.spT=0;ucf(0,2);return{rc:200,js:{}}}
 if(pa=="/pick"){await f.updateDoc(f.doc(db,"students",c),{fac:body.fac,spec:body.spec});ucf(0,1);return{rc:200,js:{}}}
 if(pa.startsWith("/a/")){const r=f.doc(db,"areas",pa.slice(3));
  if(m=="GET"){const ck="ck"+pa;if(v>=0&&Date.now()-(+LS[ck]||0)<3e5)return{rc:200,js:{same:true}};LS[ck]=Date.now();ucf(2,0);const g=await f.getDoc(r);if(!g.exists()||g.data().v===v)return{rc:200,js:{same:true}};return{rc:200,js:{n:JSON.parse(g.data().j||"[]"),v:g.data().v}}}
  if(m=="PUT"){ucf(3,1);let nv=0,bad=false;await f.runTransaction(db,async t=>{const g=await t.get(r);if(g.exists()&&g.data().v!==body.base){bad=true;return}nv=(g.exists()?g.data().v:0)+1;t.set(r,{v:nv,j:JSON.stringify(body.n)})});if(bad)LS["ck"+pa]=0;return bad?{rc:409,js:null}:{rc:200,js:{v:nv}}}}
 if(pa=="/notify")return{rc:501,js:null};

function openLink(u){
u=String(u||"").trim();if(!/^https?:\/\//i.test(u))return;
const raw=u;
try{const x=new URL(u),h=x.hostname.replace(/^www\./,"");

else if(h=="youtu.be")u="https://www.youtube.com/embed"+x.pathname;
else if(h=="drive.google.com"){const m=x.pathname.match(/\/file\/d\/([^/]+)/);if(m)u="https://drive.google.com/file/d/"+m[1]+"/preview"}}catch(e){}
let v=document.getElementById("lv");
